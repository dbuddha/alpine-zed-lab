name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lab-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify repository and immutable upstream pin
        run: |
          scripts/check.sh
          scripts/check-pin.sh --network

  provision:
    name: provision-pinned-zed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Provision and verify a clean detached checkout
        run: |
          scripts/provision-zed.sh
          scripts/check-pin.sh --network
          test -z "$(git -C .lab/zed status --porcelain)"

  ci-pass:
    name: ci-pass
    if: always()
    needs: [policy, provision]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected lab gate
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          PROVISION_RESULT: ${{ needs.provision.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$PROVISION_RESULT" = success
