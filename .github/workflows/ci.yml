name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: lab-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      alpine_commit: ${{ steps.pins.outputs.alpine_commit }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify repository and immutable upstream pin
        run: |
          scripts/check.sh
          scripts/check-pin.sh --network
      - name: Export validated public revision
        id: pins
        run: |
          alpine_commit=$(sed -nE 's/^commit = "([0-9a-f]{40})"$/\1/p' pins/alpine.toml)
          test -n "$alpine_commit"
          echo "alpine_commit=$alpine_commit" >> "$GITHUB_OUTPUT"

  provision:
    name: provision-pinned-sources
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: dbuddha/alpine-gpui
          ref: ${{ needs.policy.outputs.alpine_commit }}
          path: .lab/alpine
          persist-credentials: false
      - name: Provision and verify a clean detached checkout
        run: |
          scripts/provision-zed.sh
          scripts/check-pin.sh --network
          scripts/check-alpine-pin.sh
          test -z "$(git -C .lab/zed status --porcelain)"
          test -z "$(git -C .lab/alpine status --porcelain)"

  paired-protocol:
    name: paired-renderer-protocol
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: dbuddha/alpine-gpui
          ref: ${{ needs.policy.outputs.alpine_commit }}
          path: .lab/alpine
          persist-credentials: false
      - name: Prove paired order, identity, completeness, and no-claim controls
        run: |
          cargo build --locked \
            --manifest-path .lab/alpine/Cargo.toml \
            -p alpine-assurance
          ALPINE_ASSURANCE_BIN="$PWD/.lab/alpine/target/debug/alpine-assurance" \
            tests/paired-renderer-samples.sh artifacts/hosted-paired-protocol --keep
      - name: Upload paired protocol fixture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paired-protocol-${{ github.sha }}
          path: artifacts/hosted-paired-protocol
          retention-days: 90
          if-no-files-found: error

  gpui-oracle-equivalence:
    name: gpui-oracle-equivalence
    needs: policy
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: dbuddha/alpine-gpui
          ref: ${{ needs.policy.outputs.alpine_commit }}
          path: .lab/alpine
          persist-credentials: false
      - name: Install the optional Metal toolchain when absent
        run: |
          if ! xcrun --sdk macosx --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
      - name: Install pinned source-assurance tools
        run: |
          cargo install --locked cargo-llvm-cov --version 0.8.7
          cargo install --locked cargo-mutants --version 27.1.0
      - name: Provision pinned Zed and validate the GPL adapter
        env:
          ALPINE_ZED_COVERAGE: "1"
          ALPINE_ZED_MUTATION: "1"
        run: |
          scripts/provision-zed.sh
          scripts/check.sh
          scripts/run-renderer-equivalence.sh --adapter-only artifacts/hosted-gpui-oracle
      - name: Upload renderer equivalence and sampling evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gpui-oracle-${{ github.sha }}
          path: artifacts/hosted-gpui-oracle
          retention-days: 90
          if-no-files-found: error

  physical-sampler-bundle:
    name: physical-sampler-bundle
    needs: [policy, gpui-oracle-equivalence]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: dbuddha/alpine-gpui
          ref: ${{ needs.policy.outputs.alpine_commit }}
          path: .lab/alpine
          persist-credentials: false
      - name: Install the optional Metal toolchain when absent
        run: |
          if ! xcrun --sdk macosx --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
      - name: Download exact-run GPUI oracle evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: gpui-oracle-${{ github.sha }}
          path: artifacts/physical-sampler-oracle
      - name: Provision immutable Zed source
        run: scripts/provision-zed.sh
      - name: Build and structurally verify the candidate bundle
        env:
          ALPINE_LAB_TESTING: "1"
          ALPINE_BUNDLE_TEST_PLATFORM: darwin-arm64
          ALPINE_BUNDLE_TEST_CI_PASS: success
        run: |
          scripts/build-physical-sampler-bundle.sh \
            artifacts/physical-sampler-candidate \
            artifacts/physical-sampler-oracle \
            "${{ github.run_id }}"
          scripts/verify-physical-sampler-bundle.sh \
            artifacts/physical-sampler-candidate/physical-samplers.tar \
            artifacts/physical-sampler-candidate/physical-samplers.tar.sha256 \
            artifacts/physical-sampler-verified

  publish-physical-sampler-bundle:
    name: publish-physical-sampler-bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-pass, policy, gpui-oracle-equivalence]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: dbuddha/alpine-gpui
          ref: ${{ needs.policy.outputs.alpine_commit }}
          path: .lab/alpine
          persist-credentials: false
      - name: Install the optional Metal toolchain when absent
        run: |
          if ! xcrun --sdk macosx --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
      - name: Download exact-run GPUI oracle evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: gpui-oracle-${{ github.sha }}
          path: artifacts/physical-sampler-oracle
      - name: Provision immutable Zed source
        run: scripts/provision-zed.sh
      - name: Rebuild and verify after aggregate ci-pass
        run: |
          scripts/build-physical-sampler-bundle.sh \
            artifacts/physical-sampler-published \
            artifacts/physical-sampler-oracle \
            "${{ github.run_id }}"
          scripts/verify-physical-sampler-bundle.sh \
            artifacts/physical-sampler-published/physical-samplers.tar \
            artifacts/physical-sampler-published/physical-samplers.tar.sha256 \
            artifacts/physical-sampler-verified \
            > artifacts/physical-sampler-verification.log
      - name: Publish exact-main physical sampler bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: physical-sampler-candidate-${{ github.sha }}
          path: |
            artifacts/physical-sampler-published/physical-samplers.tar
            artifacts/physical-sampler-published/physical-samplers.tar.sha256
            artifacts/physical-sampler-verification.log
          retention-days: 90
          if-no-files-found: error

  ci-pass:
    name: ci-pass
    if: always()
    needs: [policy, provision, paired-protocol, gpui-oracle-equivalence, physical-sampler-bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected lab gate
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          PROVISION_RESULT: ${{ needs.provision.result }}
          PAIRED_PROTOCOL_RESULT: ${{ needs.paired-protocol.result }}
          GPUI_ORACLE_RESULT: ${{ needs.gpui-oracle-equivalence.result }}
          PHYSICAL_SAMPLER_RESULT: ${{ needs.physical-sampler-bundle.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$PROVISION_RESULT" = success
          test "$PAIRED_PROTOCOL_RESULT" = success
          test "$GPUI_ORACLE_RESULT" = success
          test "$PHYSICAL_SAMPLER_RESULT" = success
